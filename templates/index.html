<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Interface</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px;
            background: #2463eb;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
        }
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #eef2fb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #2463eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        .message.typing {
            background: #fff;
            color: #999;
            font-style: italic;
        }
        .chat-footer {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #f7f9ff;
            border-top: 1px solid #e5e9f5;
        }
        .chat-footer input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d7dce9;
            border-radius: 999px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .chat-footer input:focus {
            border-color: #2463eb;
        }
        .chat-footer button {
            padding: 12px 18px;
            border: none;
            border-radius: 999px;
            background: #2463eb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .chat-footer button:hover {
            background: #1a4fd4;
        }
        .chat-footer button:active {
            transform: translateY(1px);
        }
        .chat-footer button:disabled {
            background: #a0b4e8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 AI Chatbot</div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">Hello! How can I assist you today?</div>
        </div>
        <form class="chat-footer" id="chatForm">
            <input id="chatInput" type="text" placeholder="Type a message..." autocomplete="off" />
            <button type="submit" id="sendButton">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatBody = document.getElementById('chatBody');
        const sendButton = document.getElementById('sendButton');

        // Replace with your actual OpenAI API key
        const OPENAI_API_KEY = 'YOUR_API_KEY';
        let isWaitingForResponse = false;

        function addMessage(text, type) {
            const message = document.createElement('div');
            message.className = 'message ' + type;
            message.textContent = text;
            chatBody.appendChild(message);
            chatBody.scrollTop = chatBody.scrollHeight;
            return message;
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing';
            typingDiv.id = 'typingIndicator';
            typingDiv.textContent = 'Typing...';
            chatBody.appendChild(typingDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            return typingDiv;
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        async function botReply(userText) {
            // Add typing indicator
            addTypingIndicator();

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{ role: 'user', content: userText }],
                        max_tokens: 150,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                // Remove typing indicator
                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API request failed');
                }

                const reply = data.choices?.[0]?.message?.content || 'I apologize, but I couldn\'t generate a response.';
                addMessage(reply, 'bot');

            } catch (error) {
                // Remove typing indicator
                removeTypingIndicator();
                
                console.error('Error:', error);
                
                let errorMessage = 'Sorry, I encountered an error. Please try again.';
                if (error.message.includes('429')) {
                    errorMessage = 'I\'m receiving too many requests. Please wait a moment and try again.';
                } else if (error.message.includes('401')) {
                    errorMessage = 'Authentication error. Please check the API key configuration.';
                }
                
                addMessage(errorMessage, 'bot');
            } finally {
                // Re-enable input
                isWaitingForResponse = false;
                sendButton.disabled = false;
                chatInput.disabled = false;
                chatInput.focus();
            }
        }

        chatForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const text = chatInput.value.trim();
            if (!text || isWaitingForResponse) return;
            
            // Disable input while waiting for response
            isWaitingForResponse = true;
            sendButton.disabled = true;
            chatInput.disabled = true;
            
            // Add user message
            addMessage(text, 'user');
            chatInput.value = '';
            
            // Get bot reply
            await botReply(text);
        });

        // Enable input on load
        chatInput.focus();
    </script>
</body>
</html>
